<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swimlab · multi-sensor swim analysis</title>
<style>
  :root{
    --bg:#0e1116;--panel:#161b22;--panel2:#1b222c;--line:#232c39;--text:#e6edf3;
    --muted:#8b97a7;--accent:#4aa8ff;--right:#4aa8ff;--left:#ff8a5b;--good:#3fb950;
    --warn:#d29922;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--line:#e2e8f0;--text:#1a2028;
      --muted:#5a6675;--accent:#1f6feb;--right:#1f6feb;--left:#e8590c;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 64px}
  header{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between}
  h1{font-size:20px;margin:0;font-weight:680;letter-spacing:-.01em;direction:ltr;display:inline-block}
  h1 .tag{font-size:12px;color:var(--muted);font-weight:500;margin:0 8px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ltr{direction:ltr}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
  .tab{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;
    font-size:14px;font-weight:550;transition:.12s}
  .tab .ic{font-size:16px}
  .tab[aria-selected="true"]{border-color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
  .tab .pl{font-size:11px;color:var(--muted);font-weight:500}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  select,.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;font-size:14px;font-family:var(--sans)}
  .btn{cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  label.lab{font-size:13px;color:var(--muted)}
  input[type=file]{display:none}

  .banner{margin:8px 0;padding:10px 13px;border-radius:8px;font-size:13px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .kpi .k-lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .kpi .k-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:600;margin-top:8px;letter-spacing:-.02em;direction:ltr}
  .kpi .k-val .u{font-size:13px;color:var(--muted);font-weight:500;margin:0 3px}
  .kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .kpi.hero .k-val{color:var(--accent)}

  details.detail{margin:8px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  details.detail>summary{cursor:pointer;padding:14px 16px;font-weight:600;font-size:14px;list-style:none}
  details.detail>summary::-webkit-details-marker{display:none}
  details.detail>summary::before{content:"▸ ";color:var(--muted)}
  details.detail[open]>summary::before{content:"▾ "}
  .detail-body{padding:0 16px 16px}
  .panel h2{font-size:14px;margin:16px 0 3px;font-weight:600}
  .panel .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
  canvas{width:100%;height:250px;display:block}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin:0 5px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
  thead th{text-align:right;padding:8px 12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  thead th:first-child,tbody td:first-child{text-align:left}
  tbody td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  .sym{display:flex;align-items:center;gap:12px;margin:8px 0;direction:ltr}
  .sym .bar{flex:1;height:24px;border-radius:6px;overflow:hidden;display:flex;background:var(--panel2);border:1px solid var(--line)}
  .sym .bar .l{background:var(--left);opacity:.85}.sym .bar .r{background:var(--right);opacity:.85}
  .sym .cap{font-size:12px;color:var(--muted);min-width:60px}
  .chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:0 6px}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  a.link:hover{text-decoration:underline}
  .fhead{font-size:17px;font-weight:680;margin:14px 0 2px;letter-spacing:-.01em}
  .findings .f-head{font-size:16px;font-weight:660;margin:2px 0 4px}
  .findings .f-sum{margin:0 0 8px;max-width:72ch}
  ul.coach{list-style:none;padding:0;margin:6px 0 0}
  ul.coach li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
  ul.coach li:last-child{border-bottom:none}
  ul.coach .pt{font-size:14px}
  ul.coach .mchip{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;direction:ltr}
  .aibadge{font-size:10.5px;font-weight:600;color:var(--good);border:1px solid var(--good);
    border-radius:20px;padding:1px 8px;margin:0 8px;vertical-align:middle;white-space:nowrap}
  .actions{display:flex;flex-direction:column;gap:6px;margin:4px 0 4px}
  .actions .act{font-size:14px}
  #narratebtn[disabled]{opacity:.6;cursor:progress}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.6}
  .foot code{font-family:var(--mono);font-size:11.5px;direction:ltr}
  ul.drills{list-style:none;padding:0;margin:6px 0 0}
  ul.drills li{padding:11px 0;border-bottom:1px solid var(--line)}
  ul.drills li:last-child{border-bottom:none}
  ul.drills .dname{font-size:14px;font-weight:600}
  ul.drills .dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
  .dbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;
    padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .dbtn:hover{border-color:var(--accent)}
  .dhowto{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .dhowto[hidden]{display:none}
  .vmodal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
  .vmodal[hidden]{display:none}
  .vbackdrop{position:absolute;inset:0;background:rgba(0,0,0,.72)}
  .vbox{position:relative;width:min(880px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .vbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:600;font-size:14px}
  .vclose{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  .vframe-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .vframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vopen{display:block;padding:10px 14px;font-size:12.5px;color:var(--accent);text-decoration:none}
  .vopen:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>swimlab <span class="tag" id="apptag"></span></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="controls">
      <button class="btn" id="langbtn" title="language"></button>
      <label class="lab" for="pick" id="picklab"></label>
      <select id="pick"></select>
      <label class="btn" for="file" id="importlab"></label>
      <input type="file" id="file" accept="application/json,.json,text/csv,.csv" multiple>
      <button class="btn" id="narratebtn"></button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="banner" id="banner"></div>

  <div id="summary"></div>
  <div id="detail"></div>

  <div class="foot" id="foot"></div>
</div>

<div id="videoModal" class="vmodal" hidden>
  <div class="vbackdrop" data-close></div>
  <div class="vbox" role="dialog" aria-modal="true">
    <div class="vbar"><span id="videoTitle"></span><button id="videoClose" class="vclose" data-close aria-label="close">✕</button></div>
    <div class="vframe-wrap"><iframe id="videoFrame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
    <a id="videoOpen" class="vopen" target="_blank" rel="noopener"></a>
  </div>
</div>

  function lineChart(cv, tt, series, opts={}){

    if(!tt.length) return;
    const padL=44,padR=12,padT=12,padB=24,x0=padL,x1=W-padR,y0=padT,y1=H-padB;
    const tMin=tt[0],tMax=tt[tt.length-1];
    let vMax=opts.vMax||0; if(!vMax){for(const s of series)for(const v of s.data)vMax=Math.max(vMax,Math.abs(v));}
    vMax=Math.max(10,Math.ceil(vMax/10)*10);
    const X=x=>x0+(x1-x0)*(x-tMin)/(tMax-tMin||1), yc=(y0+y1)/2, Y=v=>yc-(v/vMax)*((y1-y0)/2);
    const line=cssv("--line"),muted=cssv("--muted");
    for(const b of (opts.bands||[])){ctx.fillStyle=line;ctx.globalAlpha=.45;ctx.fillRect(X(b[0]),y0,Math.max(X(b[1])-X(b[0]),1),y1-y0);ctx.globalAlpha=1;}
    ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,Y(0));ctx.lineTo(x1,Y(0));ctx.stroke();
    ctx.fillStyle=muted;ctx.font="11px "+cssv("--mono");ctx.textAlign="right";ctx.textBaseline="middle";
    for(const g of [-vMax,0,vMax]) ctx.fillText((g>0?"+":"")+g+"°",x0-6,Y(g));
    for(const s of series){ctx.strokeStyle=s.color;ctx.lineWidth=s.width||1.6;ctx.beginPath();
      for(let i=0;i<tt.length;i++){const px=X(tt[i]),py=Y(s.data[i]);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();}
    ctx.setLineDash([4,4]);ctx.strokeStyle=muted;ctx.lineWidth=1;
    for(const v of (opts.vlines||[])){ctx.beginPath();ctx.moveTo(X(v),y0);ctx.lineTo(X(v),y1);ctx.stroke();}
    ctx.setLineDash([]);
    for(const mk of (opts.markers||[])){ctx.strokeStyle=mk.color;ctx.globalAlpha=mk.dim?.3:1;ctx.lineWidth=2;

    ctx.save();ctx.translate(cx2,cy);ctx.rotate(-pitch*Math.PI/180);
    ctx.strokeStyle=left;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,28,0,2*Math.PI);ctx.stroke();
    ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(42,0);ctx.stroke();
    ctx.restore();
    ctx.fillStyle=muted;ctx.fillText("pitch "+(pitch>=0?"+":"")+pitch.toFixed(0)+"°",cx2,H-8);
  }
  function drawBody(ctx,W,H,roll){
    const accent=cssv("--accent"),muted=cssv("--muted");
    const cx=W*0.5,hipY=H*0.76;
    ctx.save();ctx.translate(cx,hipY);ctx.rotate(roll*Math.PI/180);
    ctx.strokeStyle=accent;ctx.lineWidth=3;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-66);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-32,-58);ctx.lineTo(32,-58);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-22,2);ctx.lineTo(22,2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,-82,13,0,2*Math.PI);ctx.stroke();
    ctx.restore();
    ctx.fillStyle=muted;ctx.font="11px "+cssv("--mono");ctx.textAlign="center";ctx.textBaseline="alphabetic";
    ctx.fillText("body roll "+(roll>=0?"+":"")+roll.toFixed(0)+"°",cx,H-6);
  }
  function drawArms(ctx,W,H,pR,pL){
    const right=cssv("--right"),left=cssv("--left"),muted=cssv("--muted"),line=cssv("--line");
    const cy=H*0.40,sx=W*0.5,sw=64,armLen=62;
    ctx.strokeStyle=line;ctx.lineWidth=3;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(sx-sw,cy);ctx.lineTo(sx+sw,cy);ctx.stroke();
    ctx.beginPath();ctx.arc(sx,cy-15,10,0,2*Math.PI);ctx.stroke();
    function arm(shX,pitch,color,dir){
      ctx.save();ctx.translate(shX,cy);ctx.rotate((-pitch)*Math.PI/180);
      ctx.strokeStyle=color;ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(dir*8,armLen);ctx.stroke();
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(dir*8,armLen,5,0,2*Math.PI);ctx.fill();
      ctx.restore();
    }
    arm(sx+sw,pR,right,1); arm(sx-sw,pL,left,-1);
    ctx.fillStyle=muted;ctx.font="11px "+cssv("--mono");ctx.textAlign="center";ctx.textBaseline="alphabetic";
    ctx.fillText("R "+(pR>=0?"+":"")+pR.toFixed(0)+"°    L "+(pL>=0?"+":"")+pL.toFixed(0)+"°",sx,H-6);
  }

  // ---- video modal ----
  function openVideo(yt,title){
    $("videoTitle").textContent=title||"";
    $("videoFrame").src="https://www.youtube.com/embed/"+yt+"?rel=0&autoplay=1&playsinline=1";
    const op=$("videoOpen"); op.href="https://www.youtube.com/watch?v="+yt; op.textContent=t("drillOpenYt");
    $("videoModal").hidden=false; document.addEventListener("keydown",onModalKey);
  }
  function closeVideo(){ $("videoModal").hidden=true; $("videoFrame").src="about:blank"; document.removeEventListener("keydown",onModalKey); }
  function onModalKey(e){ if(e.key==="Escape") closeVideo(); }
  $("videoModal").addEventListener("click",e=>{ if(e.target.hasAttribute("data-close")) closeVideo(); });
  // delegated drill buttons (the #detail container persists across renders)
  $("detail").addEventListener("click",e=>{
    const w=e.target.closest(".dwatch");
    if(w){ const d=DRILLS[w.dataset.pl][+w.dataset.i]; openVideo(d.yt, d.name[lang]||d.name.en); return; }
    const h=e.target.closest(".dhow");
    if(h){ const box=h.closest("li").querySelector(".dhowto"); box.hidden=!box.hidden;
      h.textContent=(box.hidden?t("drillHowto"):"▴ "+t("drillHowto").slice(2)); }
  });

  // -------- renderers --------
  function renderSacrum(p){
    const s=p.summary;
    const drift=s.pace_drift_s_per_length;
    const summary=
      kpi(t("k_distance"),fmt(s.distance_m,0),"m",t("s_lenPool")(s.lengths),true)+
      kpi(t("k_strokeCount"),s.stroke_count,"",`${s.n_valid_strokes} ${t("s_valid")}`)+
      kpi(t("k_tempo"),fmt(s.tempo_spm,1),"spm",`${fmt(s.stroke_rate_cpm,1)} ${t("s_perMin")}`)+
      kpi(t("k_bodyRoll"),fmt(s.body_roll_amplitude_deg,1),"°",t("s_meanPeak"))+
      kpi(t("k_symmetry"),fmt(s.roll_symmetry_index,3),"",symWord(s.roll_symmetry_index));
    const rows=(p.lengths||[]).map(l=>`<tr><td>#${l.length_index+1}</td><td>${fmt(l.t_start,1)}</td><td>${fmt(l.duration_s,1)}</td><td>${l.strokes}</td></tr>`).join("");
    const driftW = drift>0.05?t("w_slowing"):drift<-0.05?t("w_speeding"):t("w_steady");
    const detail=`<div class="panel"><h2>${t("h_bodyRoll")}</h2><p class="hint">${t("hint_roll")}</p><div class="ltr"><canvas id="cv"></canvas></div>
      <div class="legend"><span><span class="sw" style="background:var(--right)"></span>${t("leg_rollR")}</span><span><span class="sw" style="background:var(--left)"></span>${t("leg_rollL")}</span></div></div>
      <div class="panel"><h2>${t("h_symmetry")}</h2><p class="hint">${t("hint_sym")}</p>${symBar(s.mean_peak_roll_right_deg,s.mean_peak_roll_left_deg,"° R","L")}
      <div class="sub">${t("pushInfo")(s.pushoff_count,(drift>0?"+":"")+fmt(drift,2)+" s/len ("+driftW+")")}</div></div>
      <div class="panel"><h2>${t("h_perLength")}</h2><p class="hint">${t("hint_perLength")}</p><div class="ltr"><table><thead><tr><th>${t("th_length")}</th><th>${t("th_start")}</th><th>${t("th_dur")}</th><th>${t("th_strokes")}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    const draw=()=>{const markers=(p.strokes||[]).map(st=>({t:st.t_peak,color:st.side==="R"?cssv("--right"):cssv("--left"),up:st.side==="R",dim:st.excluded}));
      lineChart($("cv"),p.traces.t,[{data:p.traces.roll,color:cssv("--accent")}],{markers,bands:(p.pushoffs||[]).map(x=>[x,x+4]),vlines:p.pushoffs});};
    return {summary,detail,draw};
  }
  function renderWrist(p){
    const R=p.arms.R.summary,L=p.arms.L.summary,sy=p.symmetry;
    const summary=
      kpi(t("k_strokeCount"),`${R.stroke_count}/${L.stroke_count}`,"",t("s_RL"),true)+
      kpi(t("k_ampSym"),fmt(sy.amplitude_symmetry_index,2),"",symWord(sy.amplitude_symmetry_index))+
      kpi(t("k_phase"),fmt(sy.mean_phase_offset_cycles,2),"",t("s_antiphase"))+
      kpi(t("k_strokeRate"),fmt(R.stroke_rate_cpm,1),"cpm",t("s_rightArm"))+
      kpi(t("k_pullFrac"),fmt(R.pull_fraction,2),"",t("s_underWater"));
    const armRow=(lab,a)=>`<tr><td>${lab}</td><td>${a.stroke_count}</td><td>${fmt(a.stroke_rate_cpm,1)}</td><td>${fmt(a.pitch_amplitude_deg,0)}</td><td>${fmt(a.mean_pull_duration_s,2)}</td><td>${fmt(a.pull_fraction,2)}</td></tr>`;
    const detail=`<div class="panel"><h2>${t("h_forearm")}</h2><p class="hint">${t("hint_forearm")}</p><div class="ltr"><canvas id="cv"></canvas></div>
      <div class="legend"><span><span class="sw" style="background:var(--right)"></span>${t("leg_rArm")}</span><span><span class="sw" style="background:var(--left)"></span>${t("leg_lArm")}</span></div></div>
      <div class="panel"><h2>${t("h_perArm")}</h2><div class="ltr"><table><thead><tr><th>${t("th_arm")}</th><th>${t("th_strokes")}</th><th>${t("th_rate")}</th><th>${t("th_amp")}</th><th>${t("th_pull")}</th><th>${t("th_pullFrac")}</th></tr></thead><tbody>${armRow(t("r_right"),R)}${armRow(t("r_left"),L)}</tbody></table></div></div>
      <div class="panel"><h2>${t("h_symFusion")}</h2>${symBar(R.pitch_amplitude_deg,L.pitch_amplitude_deg,"° R","L")}
      <div class="ltr"><table><tbody>
        <tr><td>${t("row_strokeIdx")}</td><td>${fmt(sy.stroke_count_symmetry_index,3)}</td></tr>
        <tr><td>${t("row_ampIdx")}</td><td>${fmt(sy.amplitude_symmetry_index,3)}</td></tr>
        <tr><td>${t("row_pullIdx")}</td><td>${fmt(sy.pull_duration_symmetry_index,3)}</td></tr>
        <tr><td>${t("row_phase")}</td><td>${fmt(sy.mean_phase_offset_cycles,3)}</td></tr></tbody></table></div></div>`;
    const draw=()=>{const markers=[];
      for(const st of (p.arms.R.strokes||[])) markers.push({t:st.t_pull,color:cssv("--right"),up:false,dim:st.excluded});
      for(const st of (p.arms.L.strokes||[])) markers.push({t:st.t_pull,color:cssv("--left"),up:true,dim:st.excluded});
      lineChart($("cv"),p.arms.R.traces.t,[{data:p.arms.R.traces.pitch,color:cssv("--right")},{data:p.arms.L.traces.pitch,color:cssv("--left")}],{markers});};
    return {summary,detail,draw};
  }
  function renderHead(p){
    const s=p.summary;
    const summary=
      kpi(t("k_pattern"),esc(p.detected_pattern||"—"),"",t("s_gate")(fmt(p.gate_threshold_deg,1)),true)+
      kpi(t("k_dpitch"),fmt(s.mean_d_pitch_breath,1),"°",t("s_breathLift"))+
      kpi(t("k_peakRoll"),fmt(s.mean_peak_roll_breath,1),"°",t("s_breathRot"))+
      kpi(t("k_consistency"),fmt(s.pitch_variability,1),"°",t("s_sdBreaths"))+
      kpi(t("k_breaths"),`${s.n_valid}/${s.n_breaths}`,"",t("s_validTotal"));
    const detail=`<div class="panel"><h2>${t("h_headTrace")}</h2><p class="hint">${t("hint_headTrace")}</p><div class="ltr"><canvas id="cv"></canvas></div>
      <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>${t("leg_pitch")}</span><span><span class="sw" style="background:var(--left)"></span>${t("leg_roll")}</span></div></div>
      <div class="panel"><h2>${t("h_summary")}</h2><div class="ltr"><table><tbody>
        <tr><td>${t("mMeanDp")}</td><td>${fmt(s.mean_d_pitch_breath,1)}°</td></tr>
        <tr><td>${t("mPeakRoll")}</td><td>${fmt(s.mean_peak_roll_breath,1)}°</td></tr>
        <tr><td>${t("mRatio")}</td><td>${fmt(s.mean_roll_pitch_ratio,2)}</td></tr>
        <tr><td>${t("mAsym")}</td><td>${fmt(s.asymmetry_index,3)}</td></tr>
        <tr><td>${t("mVar")}</td><td>${fmt(s.pitch_variability,1)}°</td></tr></tbody></table></div></div>`;
    const draw=()=>lineChart($("cv"),p.traces.t,[{data:p.traces.pitch,color:cssv("--accent")},{data:p.traces.roll,color:cssv("--left")}],{vlines:p.pushoffs||[]});
    return {summary,detail,draw};
  }
  const RENDER={sacrum:renderSacrum,wrist:renderWrist,head:renderHead};

  function render(){
    applyChrome(); drawTabs(); drawPicker();
    const p=BUNDLE[active].sessions[sel[active]];
    const flags=(p.flags||[]);
    $("sub").innerHTML=`${esc(p.swimmer_id||sel[active])} · ${esc(p.session||"")}`+
      (flags.length?flags.map(f=>`<span class="chip" style="color:var(--warn)">${esc(f)}</span>`).join(""):"");
    $("banner").textContent=t("banner")[active];
    const r=RENDER[active](p);
    const hl=analysisHeadline(p);
    const fh=hl?`<div class="fhead">${esc(hl)}</div>`:"";
    $("summary").innerHTML=`${fh}<div class="kpis">${r.summary}</div>`;
    $("detail").innerHTML=`<details class="detail" open><summary>${t("seeFull")}</summary>`+
      `<div class="detail-body">${analysisHTML(p)}${r.detail}${schematicHTML(active)}${drillsHTML(active)}</div></details>`;
    r.draw(); startSchematic(p); window._draw=r.draw; window._p=p;
  }
  window.addEventListener("resize",()=>{ if(window._draw)window._draw(); if(window._p)startSchematic(window._p); });

  function classify(obj){
    if(obj.placement==="sacrum"||(obj.summary&&obj.summary.body_roll_amplitude_deg!=null)) return "sacrum";
    if(obj.placement==="wrist"||obj.arms) return "wrist";
    if(obj.summary&&obj.summary.mean_d_pitch_breath!=null) return "head";
    return null;
  }
  // Ingest a processed session bundle (the output of the backend or an export).
  function ingestBundle(obj,srcName){
    let added=0,firstP=null;
    const ingest=(k,payload)=>{const pl=classify(payload); if(!pl) return;
      if(!BUNDLE[pl]){BUNDLE[pl]={sessions:{},default:k}; if(!ORDER.includes(pl))ORDER.unshift(pl);}
      const key=k+" (imported)"; BUNDLE[pl].sessions[key]=payload; sel[pl]=key; added++; firstP=pl;};
    if(obj.placements){for(const pk of Object.keys(obj.placements)){const b=obj.placements[pk];for(const k of Object.keys(b.sessions||{}))ingest(k,b.sessions[k]);}}
    else if(obj.sessions){for(const k of Object.keys(obj.sessions))ingest(k,obj.sessions[k]);}
    else ingest(obj.swimmer_id||srcName,obj);
    if(added){active=firstP; render();}
    return added;
  }

  // Group raw DOT CSVs into per-placement recordings for `process_session`,
  // reading placement + pose from each file's name/path (head/trial.csv,
  // sacrum/t0a.csv, wrist_l/t0b.csv, …). Returns {recordings, unmatched}.
  const _PLACEMENTS_RE=/(wrist_l|wrist_r|head|sacrum|ankle_l|ankle_r|uparm_l|uparm_r)/i;
  async function csvsToRecordings(files){
    const groups={},unmatched=[];
    for(const f of files){
      const name=(f.webkitRelativePath||f.name||"").toLowerCase();
      const pm=name.match(_PLACEMENTS_RE);
      const role=/t0a/.test(name)?"t0a":/t0b/.test(name)?"t0b":/trial|swim|t7/.test(name)?"trial":null;
      if(!pm||!role){unmatched.push(f.name); continue;}
      const pl=pm[1]; (groups[pl]=groups[pl]||{placement_id:pl})[role]=await f.text();
    }
    const recordings=Object.values(groups).filter(g=>g.trial&&g.t0a&&g.t0b);
    for(const g of Object.values(groups)) if(!(g.trial&&g.t0a&&g.t0b)) unmatched.push(g.placement_id+" (needs trial+t0a+t0b)");
    return {recordings,unmatched};
  }

  async function processRecordings(request){
    if(!(window.SwimBackend&&window.SwimBackend.processSession)){ alert(t("needBackend")); return; }
    const recordings=request.recordings||(request.data&&request.data.recordings)||[];
    const pool=request.pool_length_m||(request.data&&request.data.pool_length_m)||25;
    if(!recordings.length){ alert(t("needBackend")); return; }
    const prev=$("importlab").textContent; $("importlab").textContent=t("processing");
    try{
      const bundle=await window.SwimBackend.processSession(recordings,pool);
      const n=ingestBundle(bundle,"session");
      if(!n) alert("Not a recognised swimlab session payload.");
    }catch(err){ alert("Processing failed ("+(err.message||err)+")"); }
    finally{ $("importlab").textContent=prev; }
  }

  $("file").addEventListener("change",async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    e.target.value="";
    try{
      const csvs=files.filter(f=>/\.csv$/i.test(f.name)||f.type==="text/csv");
      if(csvs.length){
        // Raw DOT recordings -> backend `process_session`.
        const {recordings,unmatched}=await csvsToRecordings(csvs);
        if(!recordings.length){ alert(t("csvUnrecognised")+(unmatched.length?("\n\n"+unmatched.join(", ")):"")); return; }
        await processRecordings({recordings});
        if(unmatched.length) console.warn("[swimlab] unmatched CSVs:",unmatched);
        return;
      }
      const obj=JSON.parse(await files[0].text());
      // A recordings manifest (from tools/make_sample_recordings.py) -> backend.
      if(obj.recordings||(obj.data&&obj.data.recordings)){ await processRecordings(obj); return; }
      // Otherwise a processed session/bundle payload -> ingest directly.
      if(!ingestBundle(obj,obj.swimmer_id||files[0].name)) alert("Not a recognised swimlab session payload.");
    }catch(err){alert("Could not read file: "+err.message);}
  });

  render();
})();
</script>

<!-- Phase B: connect to the deployed swimlab backend (Firebase callable
     functions), so narration and raw-DOT processing use a server secret with no
     worker URL. Active only when firebase-config.js set window.SWIMLAB_FIREBASE_CONFIG
     (the hosted app); the offline artifacts skip this entirely. -->
<script type="module">
(async () => {
  const cfg = window.SWIMLAB_FIREBASE_CONFIG;
  if (!cfg) return;                       // offline artifact / not configured
  const V = window.SWIMLAB_FIREBASE_SDK_VERSION || "10.12.0";
  try {
    const { initializeApp } = await import(
      `https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFunctions, httpsCallable, connectFunctionsEmulator } = await import(
      `https://www.gstatic.com/firebasejs/${V}/firebase-functions.js`);
    const app = initializeApp(cfg);
    const region = cfg.functionsRegion || "us-central1";
    const fns = getFunctions(app, region);
    if (window.SWIMLAB_FUNCTIONS_EMULATOR) {
      const [host, port] = String(window.SWIMLAB_FUNCTIONS_EMULATOR).split(":");
      connectFunctionsEmulator(fns, host || "localhost", Number(port) || 5001);
    }
    const _process = httpsCallable(fns, "process_session", { timeout: 300000 });
    const _narrate = httpsCallable(fns, "narrate", { timeout: 120000 });
    window.SwimBackend = {
      region,
      // recordings: [{placement_id, trial, t0a, t0b, ...}] -> dashboard bundle
      async processSession(recordings, poolLengthM = 25) {
        const { data } = await _process({ recordings, pool_length_m: poolLengthM });
        return data;
      },
      // one placement's payload -> {narratives:{en,he}, model, placement}
      async narrate(payload, placement) {
        const { data } = await _narrate({ payload, placement });
        return data;
      },
    };
    document.dispatchEvent(new CustomEvent("swimbackend:ready", { detail: { region } }));
  } catch (e) {
    console.warn("[swimlab] Firebase backend unavailable:", (e && e.message) || e);
  }
})();
</script>
</body>
