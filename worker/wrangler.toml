# Cloudflare Worker config for the swimlab-viewer live-narration proxy.
# Deploy: `cd worker && npx wrangler deploy`
name = "swimlab-narrate"
main = "narrate-worker.js"
compatibility_date = "2026-01-01"

[vars]
# Lock CORS to your GitHub Pages origin. Change to your username's Pages URL.
# Use "*" only for local testing — a public "*" lets any website call your key.
ALLOWED_ORIGIN = "https://liorshur.github.io"
# Model = the main speed lever. Uncomment one; faster models finish in a few
# seconds vs ~30s on Opus. claude-haiku-4-5 = fastest/cheapest,
# claude-sonnet-5 = near-Opus quality + faster, claude-opus-5 = best/slowest.
# 
NARRATE_MODEL = "claude-haiku-4-5"

# Thinking control (independent of the model). Uncomment to override:
#   "auto" (default) — on for Sonnet 5 / Opus 5, off for Haiku 4.5
#   "on"             — thinking on (Sonnet 5 / Opus 5; Haiku can't, stays off)
#   "off"            — thinking off (faster; e.g. Sonnet 5 without thinking)
# NARRATE_THINKING = "off"

# Secrets are NOT stored here. Set them once with wrangler:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put SHARED_SECRET     # optional
